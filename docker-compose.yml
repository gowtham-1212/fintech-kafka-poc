version: '3.8'

services:
  kafka:
    image: bitnamilegacy/kafka:3.8
    ports:
      - "9096:9092" # Remapped from 9092
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://10.55.66.123:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=L69-it6hSyuw6e_E74_Z5A
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8086:8080" # Remapped from 8080
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kraft
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=10.55.66.123:9094
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - kafka

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017" # Remapped from 27017
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    ports:
      - "6380:6379" # Remapped from 6379
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:10.55.66.123:6380
    ports:
      - "8087:8081" # Remapped from 8081
    depends_on:
      - redis

  payment-gateway:
    build: 
      context: ./services/payment-gateway
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - PORT=3001
    ports:
      - "3011:3001" # Remapped from 3001
    depends_on:
      - kafka

  transaction-engine:
    build:
      context: ./services/transaction-engine
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://10.55.66.123:27018/payments
    depends_on:
      - kafka
      - mongodb

  notification-worker:
    build:
      context: ./services/notification-worker
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - PORT=3003
    ports:
      - "3013:3003" # Remapped from 3003
    depends_on:
      - kafka

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=redis://10.55.66.123:6380
    depends_on:
      - kafka
      - redis

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
    ports:
      - "5183:5173" # Remapped from 5173
    environment:
      - VITE_NOTIFICATION_SERVICE_URL=http://10.55.66.123:3013 # Updated to match remapped port
    depends_on:
      - notification-worker

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  mongodb_data:
  redis_data:
